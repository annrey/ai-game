name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  NODE_VERSION: '20'

jobs:
  # 安全检查 - Secrets 扫描
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for secrets in commits
        run: |
          git log --all --pretty=format:"%H" | while read commit; do
            git show $commit | grep -iE "(api[_-]?key|secret|token|password)\s*=\s*[\"'][^\"']{20,}[\"']" && echo "⚠️ Potential secret found in commit $commit" || true
          done

      - name: Check for .env files in commits
        run: |
          if git log --all --name-only --pretty=format: | grep -qE "\.env(\.[^/]+)?$"; then
            echo "⚠️ Warning: .env files found in git history"
          fi

      - name: Scan for common secret patterns
        run: |
          patterns=(
            "sk-[a-zA-Z0-9]{20,}"
            "gh[pousr]_[A-Za-z0-9_]{20,}"
            "[A-Za-z0-9+/]{30,}={0,2}"
          )
          for pattern in "${patterns[@]}"; do
            if git log --all -p | grep -E "$pattern" > /dev/null 2>&1; then
              echo "⚠️ Potential secret pattern detected: $pattern"
            fi
          done

  # Rust 代码质量检查 (全 workspace)
  rust-checks:
    name: Rust Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - game_core
          - memory
          - world
          - server
          - openclaw-bevy
          - openclaw-tauri
          - openclaw-node

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.package }}

      - name: Check formatting
        working-directory: ./newgame
        run: cargo fmt --package ${{ matrix.package }} -- --check

      - name: Run clippy
        working-directory: ./newgame
        run: cargo clippy --package ${{ matrix.package }} -- -D warnings

      - name: Run tests
        working-directory: ./newgame
        run: cargo test --package ${{ matrix.package }} --verbose

  # TypeScript/Node.js 检查
  node-checks:
    name: Node.js Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - '@openclaw/core'
          - '@openclaw/memory'
          - '@openclaw/server'
          - '@openclaw/ui'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm --filter ${{ matrix.package }} exec tsc --noEmit

      - name: Run tests
        run: pnpm --filter ${{ matrix.package }} test run

  # 全 workspace 测试汇总
  test-full:
    name: Full Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run all tests
        run: pnpm test run

  # 代码覆盖率检查
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Generate coverage
        working-directory: ./newgame
        run: cargo tarpaulin --workspace --out Xml --timeout 120

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./newgame/cobertura.xml
          fail_ci_if_error: true

  # 依赖安全检查
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run Rust security audit
        working-directory: ./newgame
        run: cargo audit --deny warnings

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run npm audit
        run: pnpm audit --prod
