<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenClaw Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0f0e17;
      --bg-secondary: #1a1825;
      --bg-tertiary: #242236;
      --text-primary: #fffffe;
      --text-secondary: #a7a9be;
      --accent-gold: #ff8906;
      --accent-crimson: #e53170;
      --accent-teal: #2cb67d;
      --border-color: rgba(255, 137, 6, 0.15);
      --shadow-glow: 0 0 20px rgba(255, 137, 6, 0.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Serif SC', serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 背景纹理 */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image:
        radial-gradient(circle at 20% 50%, rgba(255, 137, 6, 0.03) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(44, 182, 125, 0.03) 0%, transparent 50%),
        radial-gradient(circle at 50% 10%, rgba(229, 49, 112, 0.02) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .app-container {
      display: grid;
      grid-template-columns: 280px 1fr 320px;
      grid-template-rows: 60px 1fr;
      height: 100vh;
      position: relative;
      z-index: 1;
    }

    /* 顶部导航 */
    .top-bar {
      grid-column: 1 / -1;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }

    .logo {
      font-family: 'Cinzel', serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent-gold);
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(255, 137, 6, 0.3);
    }

    .game-time {
      font-family: 'Cinzel', serif;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    /* 左侧面板 */
    .left-panel {
      background: var(--bg-secondary);
      border-right: 1px solid var(--border-color);
      padding: 20px;
      overflow-y: auto;
    }

    .panel-title {
      font-family: 'Cinzel', serif;
      font-size: 0.85rem;
      color: var(--accent-gold);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .stat-label {
      color: var(--text-secondary);
      font-size: 0.85rem;
    }

    .stat-value {
      font-family: 'Cinzel', serif;
      color: var(--text-primary);
    }

    .health-bar, .stamina-bar {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      margin-top: 4px;
      overflow: hidden;
    }

    .health-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-crimson), #ff6b6b);
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    .stamina-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-teal), #4ecdc4);
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    .inventory-list {
      list-style: none;
    }

    .inventory-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      margin-bottom: 4px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 6px;
      font-size: 0.85rem;
      transition: background 0.2s;
    }

    .inventory-item:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .item-icon {
      font-size: 1.2rem;
    }

    /* 中央主区域 */
    .main-area {
      display: flex;
      flex-direction: column;
      padding: 24px;
      overflow-y: auto;
    }

    .scene-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 28px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-glow);
    }

    .scene-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .scene-icon {
      font-size: 2rem;
    }

    .scene-title {
      font-family: 'Cinzel', serif;
      font-size: 1.4rem;
      color: var(--accent-gold);
    }

    .scene-subtitle {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .scene-description {
      line-height: 1.8;
      color: var(--text-primary);
      font-size: 1rem;
      white-space: pre-line;
    }

    .action-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .action-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Noto Serif SC', serif;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .action-btn:hover {
      border-color: var(--accent-gold);
      color: var(--accent-gold);
      box-shadow: 0 0 10px rgba(255, 137, 6, 0.2);
    }

    .action-btn.primary {
      background: rgba(255, 137, 6, 0.1);
      border-color: var(--accent-gold);
      color: var(--accent-gold);
    }

    /* 右侧面板 */
    .right-panel {
      background: var(--bg-secondary);
      border-left: 1px solid var(--border-color);
      padding: 20px;
      overflow-y: auto;
    }

    .info-card {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .info-card-title {
      font-family: 'Cinzel', serif;
      font-size: 0.8rem;
      color: var(--accent-teal);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .creature-list {
      list-style: none;
    }

    .creature-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .creature-item::before {
      content: '◆';
      color: var(--accent-crimson);
      font-size: 0.6rem;
    }

    .terrain-info {
      font-size: 0.85rem;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .terrain-tag {
      display: inline-block;
      padding: 2px 8px;
      background: rgba(255, 137, 6, 0.1);
      border-radius: 4px;
      color: var(--accent-gold);
      font-size: 0.75rem;
      margin-right: 6px;
      margin-bottom: 4px;
    }

    /* 滚动条 */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* 动画 */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .scene-card {
      animation: fadeIn 0.5s ease;
    }

    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
      color: var(--accent-gold);
      font-family: 'Cinzel', serif;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="top-bar">
      <div class="logo">⚔️ OpenClaw</div>
      <div class="game-time" id="gameTime">加载中...</div>
    </header>

    <aside class="left-panel">
      <div class="panel-title">角色状态</div>
      <div class="stat-row">
        <span class="stat-label">生命值</span>
        <span class="stat-value" id="healthValue">100/100</span>
      </div>
      <div class="health-bar">
        <div class="health-fill" id="healthBar" style="width: 100%"></div>
      </div>

      <div class="stat-row" style="margin-top: 12px;">
        <span class="stat-label">体力值</span>
        <span class="stat-value" id="staminaValue">100/100</span>
      </div>
      <div class="stamina-bar">
        <div class="stamina-fill" id="staminaBar" style="width: 100%"></div>
      </div>

      <div class="panel-title" style="margin-top: 24px;">背包</div>
      <ul class="inventory-list" id="inventoryList">
        <li class="inventory-item">
          <span class="item-icon">🗡️</span>
          <span>生锈的匕首</span>
        </li>
      </ul>

      <div class="panel-title" style="margin-top: 24px;">声望</div>
      <div id="reputationList"></div>
    </aside>

    <main class="main-area">
      <div class="scene-card">
        <div class="scene-header">
          <span class="scene-icon">🏰</span>
          <div>
            <div class="scene-title" id="locationName">银酒杯酒馆</div>
            <div class="scene-subtitle" id="locationSubtitle">镇中心 · 平原</div>
          </div>
        </div>
        <div class="scene-description" id="sceneDescription">
          正在加载世界...
        </div>
        <div class="action-buttons" id="actionButtons">
          <button class="action-btn primary" onclick="explore()">🔍 探索周围</button>
          <button class="action-btn" onclick="rest()">😴 休息</button>
          <button class="action-btn" onclick="checkInventory()">🎒 检查背包</button>
        </div>
      </div>

      <div class="scene-card" id="detailCard" style="display: none;">
        <div class="scene-header">
          <span class="scene-icon">📜</span>
          <div>
            <div class="scene-title">详细信息</div>
          </div>
        </div>
        <div class="scene-description" id="detailContent"></div>
      </div>
    </main>

    <aside class="right-panel">
      <div class="info-card">
        <div class="info-card-title">地形信息</div>
        <div class="terrain-info" id="terrainInfo">
          加载中...
        </div>
      </div>

      <div class="info-card">
        <div class="info-card-title">区域文化</div>
        <div class="terrain-info" id="cultureInfo">
          加载中...
        </div>
      </div>

      <div class="info-card">
        <div class="info-card-title">在场生物</div>
        <ul class="creature-list" id="creatureList">
          <li class="creature-item">加载中...</li>
        </ul>
      </div>

      <div class="info-card">
        <div class="info-card-title">环境</div>
        <div class="terrain-info" id="environmentInfo">
          🌤️ 晴朗<br>
          🕐 早晨
        </div>
      </div>
    </aside>
  </div>

  <script>
    // Tauri API
    const { invoke } = window.__TAURI__;

    let currentState = null;

    async function loadWorld() {
      try {
        const description = await invoke('get_world_description');
        document.getElementById('sceneDescription').textContent = description;

        const stateJson = await invoke('get_world_state');
        currentState = JSON.parse(stateJson);
        updateUI(currentState);
      } catch (e) {
        console.error('加载世界失败:', e);
        document.getElementById('sceneDescription').textContent = '无法连接到游戏世界。';
      }
    }

    function updateUI(state) {
      // 更新时间
      const time = state.game_time;
      document.getElementById('gameTime').textContent = 
        `${time.year}年${time.month}月${time.day}日 ${time.hour}:${time.minute.toString().padStart(2, '0')}`;

      // 更新位置
      document.getElementById('locationName').textContent = 
        state.current_building_id ? '银酒杯酒馆' : '未知地点';
      document.getElementById('locationSubtitle').textContent = 
        `${state.current_location_id} · ${state.current_terrain_id || '未知地形'}`;

      // 更新角色状态
      const player = state.player_state;
      document.getElementById('healthValue').textContent = `${player.health}/${player.max_health}`;
      document.getElementById('healthBar').style.width = `${(player.health / player.max_health) * 100}%`;
      document.getElementById('staminaValue').textContent = `${player.stamina}/${player.max_stamina}`;
      document.getElementById('staminaBar').style.width = `${(player.stamina / player.max_stamina) * 100}%`;

      // 更新背包
      const inventoryList = document.getElementById('inventoryList');
      inventoryList.innerHTML = player.inventory.map(item => `
        <li class="inventory-item">
          <span class="item-icon">${getItemIcon(item.item_type)}</span>
          <span>${item.name} x${item.quantity}</span>
        </li>
      `).join('');

      // 更新环境
      const timeOfDayMap = {
        'Dawn': '🌅 黎明',
        'Morning': '🌄 早晨',
        'Noon': '☀️ 正午',
        'Afternoon': '🌤️ 下午',
        'Dusk': '🌆 黄昏',
        'Night': '🌙 夜晚',
        'Midnight': '🌑 午夜'
      };
      document.getElementById('environmentInfo').innerHTML = 
        `${state.weather}<br>${timeOfDayMap[time.time_of_day] || time.time_of_day}`;

      // 加载地形信息
      loadTerrainInfo(state.current_location_id);

      // 加载文化信息
      loadCultureInfo(state.region_culture_id);

      // 加载生物
      loadCreatures(state.current_location_id);
    }

    function getItemIcon(type) {
      const icons = {
        'weapon': '🗡️',
        'food': '🍞',
        'potion': '🧪',
        'key': '🔑',
        'misc': '📦'
      };
      return icons[type] || '📦';
    }

    async function loadTerrainInfo(locationId) {
      try {
        const terrainJson = await invoke('get_terrain_info', { locationId });
        const terrain = JSON.parse(terrainJson);
        document.getElementById('terrainInfo').innerHTML = `
          <strong style="color: var(--accent-gold)">${terrain.name}</strong><br>
          ${terrain.description}<br><br>
          <span class="terrain-tag">移动难度: ${terrain.properties.move_difficulty}</span>
          <span class="terrain-tag">危险度: ${terrain.properties.danger_level}</span>
          <span class="terrain-tag">视野: ${terrain.properties.visibility_multiplier}x</span>
        `;
      } catch (e) {
        document.getElementById('terrainInfo').textContent = '无地形信息';
      }
    }

    async function loadCultureInfo(regionId) {
      if (!regionId) {
        document.getElementById('cultureInfo').textContent = '无文化信息';
        return;
      }
      try {
        const cultureJson = await invoke('get_culture_info', { regionId });
        const culture = JSON.parse(cultureJson);
        document.getElementById('cultureInfo').innerHTML = `
          <strong style="color: var(--accent-gold)">${culture.name}</strong><br>
          ${culture.description}<br><br>
          <span class="terrain-tag">语言: ${culture.core.language.name}</span>
          <span class="terrain-tag">宗教: ${culture.core.religion.name}</span>
        `;
      } catch (e) {
        document.getElementById('cultureInfo').textContent = '无文化信息';
      }
    }

    async function loadCreatures(locationId) {
      try {
        const creaturesJson = await invoke('get_creatures_in_location', { locationId });
        const creatures = JSON.parse(creaturesJson);
        const list = document.getElementById('creatureList');
        if (creatures.length === 0) {
          list.innerHTML = '<li class="creature-item">该区域没有生物</li>';
        } else {
          list.innerHTML = creatures.map(c => `
            <li class="creature-item">${c.display_name} (${c.alignment})</li>
          `).join('');
        }
      } catch (e) {
        document.getElementById('creatureList').innerHTML = '<li class="creature-item">无法加载生物信息</li>';
      }
    }

    async function explore() {
      const detailCard = document.getElementById('detailCard');
      const detailContent = document.getElementById('detailContent');
      
      detailCard.style.display = 'block';
      detailContent.innerHTML = '<div class="loading">🔍 探索中...</div>';

      try {
        // 模拟探索延迟
        await new Promise(r => setTimeout(r, 800));
        
        const description = await invoke('get_world_description');
        detailContent.innerHTML = description.replace(/\n/g, '<br>');
      } catch (e) {
        detailContent.textContent = '探索失败。';
      }
    }

    async function rest() {
      try {
        await invoke('advance_time', { minutes: 60 });
        const stateJson = await invoke('get_world_state');
        currentState = JSON.parse(stateJson);
        updateUI(currentState);
        
        const detailCard = document.getElementById('detailCard');
        const detailContent = document.getElementById('detailContent');
        detailCard.style.display = 'block';
        detailContent.innerHTML = '😴 你休息了一小时，恢复了些许体力。';
      } catch (e) {
        console.error(e);
      }
    }

    async function checkInventory() {
      const detailCard = document.getElementById('detailCard');
      const detailContent = document.getElementById('detailContent');
      detailCard.style.display = 'block';
      
      if (currentState) {
        const items = currentState.player_state.inventory;
        detailContent.innerHTML = `
          <strong>背包物品:</strong><br><br>
          ${items.map(item => `• ${item.name} x${item.quantity} - ${item.description}`).join('<br>')}
        `;
      }
    }

    // 初始化
    document.addEventListener('DOMContentLoaded', loadWorld);
  </script>
</body>
</html>
