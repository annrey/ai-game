[package]
name = "openclaw-node"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi4", "async", "tokio_rt", "serde-json"] }
napi-derive = "2"
tokio = { version = "1", features = ["full"] }
serde_json = "1.0"
sqlx = { version = "0.8.3", features = ["sqlite", "runtime-tokio-rustls"] }
uuid = { version = "1.0", features = ["v4"] }
chrono = "0.4"

# Internal workspace dependencies
memory = { path = "../../crates/memory" }
game_core = { path = "../../crates/core" }

[build-dependencies]
napi-build = "2"
