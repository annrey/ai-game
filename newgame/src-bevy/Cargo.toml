[package]
name = "openclaw-bevy"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

[dependencies]
bevy = { version = "0.15", features = ["wayland"] }
bevy_egui = "0.31"
game_core = { path = "../crates/core" }
world = { path = "../crates/world" }
memory = { path = "../crates/memory" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
flume = "0.11"


